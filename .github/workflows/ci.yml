name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: syntax check
        run: npm test

      - name: cli smoke test
        run: |
          chmod +x bin/opencode-unlimited install.sh
          ./bin/opencode-unlimited help
          ./bin/opencode-unlimited version
          ./bin/opencode-unlimited doctor
          ./bin/opencode-unlimited identity show

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: node syntax
        shell: pwsh
        run: npm test

      - name: powershell syntax
        shell: pwsh
        run: |
          $failed = 0
          foreach ($file in @("bin/opencode-unlimited.ps1", "install.ps1")) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = 1
              $errors | ForEach-Object { Write-Host "$file : $($_.Message)" }
            } else {
              Write-Host "$file : ok"
            }
          }
          exit $failed

      - name: ascii only
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -File -Include *.ps1, *.js, *.cmd, opencode-unlimited | ForEach-Object {
            $text = [System.IO.File]::ReadAllText($_.FullName)
            $count = ($text.ToCharArray() | Where-Object { [int]$_ -gt 127 }).Count
            if ($count -gt 0) {
              $bad = 1
              Write-Host "$($_.Name): $count non-ascii characters"
            }
          }
          exit $bad

      - name: cli responds
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File bin/opencode-unlimited.ps1 help
